name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (no Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run fast test slice
        run: |
          ./gradlew --no-daemon test \
            --tests "*MatchingEngineTest" \
            --tests "*AlpacaAdapterTest" \
            --tests "*SimulatorFlowIntegrationTest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test

  postgres-testcontainers:
    name: Postgres integration (Docker aware)
    runs-on: ubuntu-latest
    needs: core-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Detect Docker availability
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Postgres Testcontainers test
        if: steps.docker.outputs.available == 'true'
        run: |
          ./gradlew --no-daemon test --tests "*SimulatorPostgresIntegrationTest"

      - name: Docker not available notice
        if: steps.docker.outputs.available != 'true'
        run: echo "Docker not available. Postgres Testcontainers test skipped."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test

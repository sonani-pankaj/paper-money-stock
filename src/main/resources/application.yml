spring:
  application:
    name: paperstock
  datasource:
    url: jdbc:h2:mem:paperstock;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names:
      - marketData
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s

paperstock:
  mode: simulator
  fee-percentage: 0.001
  available-liquidity: 100
  symbols:
    - AAPL
    - TSLA
  alpaca:
    base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets}
    data-base-url: ${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
    api-key: ${ALPACA_API_KEY:}
    api-secret: ${ALPACA_API_SECRET:}
  market-data:
    base-url: ${MARKET_DATA_BASE_URL:https://api.exchangerate.host}
    poll-ms: 30000

resilience4j:
  retry:
    instances:
      alpacaClient:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      alpacaClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    com.aigrama.papermoney: INFO
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    reactor.netty: WARN
    io.micrometer: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

spring:
  application:
    name: paperstock
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:h2:mem:paperstock;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names:
      - marketData
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s

paperstock:
  mode: simulator
  fee-percentage: 0.001
  available-liquidity: 100
  symbols:
    - AAPL
    - TSLA
  alpaca:
    base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets}
    data-base-url: ${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
    api-key: ${ALPACA_API_KEY:}
    api-secret: ${ALPACA_API_SECRET:}
  market-data:
    provider: ${MARKET_DATA_PROVIDER:finnhub}
    base-url: ${MARKET_DATA_BASE_URL:https://api.exchangerate.host}
    max-stale-seconds: ${MARKET_DATA_MAX_STALE_SECONDS:120}
    finnhub:
      base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
      api-key: ${FINNHUB_API_KEY:}
    yahoo:
      quote-base-url: ${YAHOO_QUOTE_BASE_URL:https://query1.finance.yahoo.com}
      chart-base-url: ${YAHOO_CHART_BASE_URL:https://query2.finance.yahoo.com}
      search-base-url: ${YAHOO_SEARCH_BASE_URL:https://query2.finance.yahoo.com}
    twelvedata:
      base-url: ${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
      api-key: ${TWELVEDATA_API_KEY:demo}
    poll-ms: 3000
  strategy:
    enabled: true
    eval-ms: 3000
  ai:
    enabled: ${PAPERSTOCK_AI_ENABLED:true}
    sentiment:
      lookback-hours: ${PAPERSTOCK_AI_SENTIMENT_LOOKBACK_HOURS:24}
    volatility:
      window: ${PAPERSTOCK_AI_VOLATILITY_WINDOW:30}
      factor: ${PAPERSTOCK_AI_VOLATILITY_FACTOR:2.0}
    probability:
      threshold: ${PAPERSTOCK_AI_PROBABILITY_THRESHOLD:0.55}

resilience4j:
  retry:
    instances:
      alpacaClient:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      alpacaClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    com.aigrama.papermoney: INFO
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    reactor.netty: WARN
    io.micrometer: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/paperstock
    username: paperstock
    password: paperstock
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

# Run with: ./gradlew bootRun -Dspring.profiles.active=postgres
